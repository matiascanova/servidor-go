services:
  database:
    image: postgres:17-alpine
    container_name: postgres-db
    environment:
      - POSTGRES_DB=apirest
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      # Se eliminó el volumen pgdata para que los scripts corran siempre
      - ./sql/schema/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./sql/schema/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
      # Sincroniza la secuencia de idUsuario con los ids que insertó el seed
      - ./sql/schema/post_seed.sql:/docker-entrypoint-initdb.d/03-post-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d apirest"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: go-api
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@database:5432/apirest?sslmode=disable
      # Poner en true si la app se sirve detrás de HTTPS
      - COOKIE_SECURE=false
    depends_on:
      database:
        condition: service_healthy
