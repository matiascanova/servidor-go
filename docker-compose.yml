services:
  database:
    image: postgres:17
    container_name: postgres-db
    environment:
      - POSTGRES_DB=apirest
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/schema/schema.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  pgdata:
